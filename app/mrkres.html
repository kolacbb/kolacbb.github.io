<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>View Results</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/marked@2.0.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_CHTML"></script>
    <style>
    .rounded-image {
      border-radius: 8px;
      width: 100%;
      height: auto;
      box-shadow: 0 1px 1px rgba(0, 0, 0, 0.2);
    }
    body {
      margin: 0;
      padding: 16px;
      font-size: 16px;
      color: #292d39;
      background-color: #f9f9f9;
      line-height: 1.6;
      overflow-y: auto; /* 添加垂直滚动条 */
    }
  </style>
</head>
<body>
<div id="image-container"></div>
<div id="markdown-container"></div>

<script>
    // Get the Markdown content from the URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const markdown = urlParams.get('content');

    // Parse Markdown and render LaTeX equations
    const html = marked('The equation provided is:\n' +
        '\n' +
        '$3x = \\sqrt{1-x-1}$\n' +
        '\n' +
        '**Solving the equation**\n' +
        '\n' +
        '1. **Simplify the equation**:\n' +
        '   $3x = \\sqrt{1-x-1}$  \n' +
        '   $3x = \\sqrt{-x}$\n' +
        '\n' +
        '2. **Understanding the domain**:  A square root is only defined for non-negative values.\n' +
        '   Thus, $-x \\ge 0$ which means $x \\le 0$.\n' +
        '\n' +
        '3. **Square both sides of the equation** (Be cautious when squaring both sides!)\n' +
        '   $(3x)^2 = (\\sqrt{-x})^2$\n' +
        '   $9x^2 = -x$\n' +
        '\n' +
        '4. **Solve the quadratic equation**:\n' +
        '   $9x^2 + x = 0$\n' +
        '   $x(9x + 1) = 0$\n' +
        '   This gives two possible solutions for $x$:\n' +
        '   * $x = 0$\n' +
        '   * $9x + 1 = 0 \\Rightarrow x = -\\frac{1}{9}$\n' +
        '\n' +
        '\n' +
        '**Checking the solutions:**\n' +
        '\n' +
        '* **If $x = 0$**:  Substituting into the original equation:\n' +
        '$3(0) = \\sqrt{1 - 0 - 1}$\n' +
        '$0 = \\sqrt{0}$\n' +
        '$0 = 0$  This solution is valid.\n' +
        '\n' +
        '* **If $x = -\\frac{1}{9}$**: Substituting into the original equation:\n' +
        '$3(-\\frac{1}{9}) = \\sqrt{1 - (-\\frac{1}{9}) - 1}$\n' +
        '$-\\frac{1}{3} = \\sqrt{\\frac{1}{9}}$\n' +
        '$-\\frac{1}{3} = \\frac{1}{3}$  This solution is not valid, as it leads to a negative square root equal to a positive value.\n' +
        '\n' +
        '\n' +
        '**Conclusion**\n' +
        '\n' +
        'The only valid solution is $x = 0$.\n' +
        '\n' +
        '**Knowledge Points:**\n' +
        '\n' +
        '* **Square Roots:** Understanding the domain of square roots (non-negative radicand).\n' +
        '* **Quadratic Equations:** Solving quadratic equations.\n' +
        '* **Solving Equations with Square Roots**:  Important to check solutions for validity.\n');
    document.getElementById('markdown-container').innerHTML = html;
    // Render the HTML with MathJax
    MathJax.Hub.Config({
      tex2jax: {
        inlineMath: [['\(', '\)']],
        displayMath: [['$$', '$$']],
        processEscapes: true,
        processEnvironments: true
      }
    });
    MathJax.Hub.Queue(['Typeset', MathJax.Hub, 'markdown-container']);


     // Get the image URL from the URL parameter
    const imgUrl = urlParams.get('img');

    // Display the image on the web page
    if (imgUrl) {
      const image = document.createElement('img');
      image.src = imgUrl;
      image.classList.add('rounded-image');
      document.getElementById('image-container').appendChild(image);
    }

    const theme = urlParams.get('theme');
    if (theme == 'dark') {
      document.body.style.color = '#c4c6d0';
      document.body.style.backgroundColor = '#202125';
    }

  </script>
</body>
</html>
